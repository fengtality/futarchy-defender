script_file_name: futarchy_twap_defense.py

# --- Target proposal (setup.sh fills these from your answers or a playbook) ---
network: mainnet-beta
proposal: PROPOSAL_PLACEHOLDER
target_direction: TARGET_PLACEHOLDER
# dao is auto-derived from the proposal; leave blank unless you need to override it.
dao: ""

# --- Budget (how much you commit; 0 = all in wallet). setup.sh fills these. ---
base_budget: 0
quote_budget: 0

# --- Pacing ---
deploy_interval_min: 30
response_gap_sec: 60

# --- Trigger ---
safety_margin_pct: 0.5
use_last_obs: true

# --- Guardrails ---
slippage_pct: 2.0
max_buy_price: 0
poll_interval_sec: 20
dry_run: false
